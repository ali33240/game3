<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詞彙注音填空小達人 - 小四國語直式注音測驗</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for winning animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'Zen Maru Gothic', sans-serif;
            background-color: #f0fdf4;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 卡片與陰影效果 */
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 #059669;
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #059669;
        }

        /* 可拖曳注音卡片樣式 */
        .draggable-card {
            touch-action: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s;
            cursor: grab;
        }
        .draggable-card:active {
            cursor: grabbing;
        }
        .draggable-card.dragging {
            opacity: 0.85;
            scale: 1.1;
            z-index: 50;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        /* 放置區（Target Spot）樣式 */
        .drop-zone {
            transition: all 0.25s ease;
        }
        .drop-zone.drag-over {
            background-color: #fef08a !important;
            border-color: #eab308 !important;
            transform: scale(1.08);
        }

        /* 動畫效果 */
        @keyframes pulse-correct {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-correct {
            animation: pulse-correct 0.4s ease-in-out;
        }

        @keyframes shake-wrong {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-wrong {
            animation: shake-wrong 0.4s ease-in-out;
        }

        /* 米字格背景效果 */
        .mi-zi-ge {
            background-image: 
                linear-gradient(to right, rgba(239, 68, 68, 0.18) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(239, 68, 68, 0.18) 1px, transparent 1px),
                linear-gradient(45deg, rgba(239, 68, 68, 0.12) 1px, transparent 1px),
                linear-gradient(-45deg, rgba(239, 68, 68, 0.12) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            background-position: center;
        }

        /* ==========================================
           標準垂直注音容器樣式
        ========================================== */
        .zhuyin-vertical-container {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.0;
            font-family: 'Noto Sans TC', sans-serif;
            padding-top: 0.15em;
        }

        /* 聲符/韻符符號（直排） */
        .zhuyin-symbols {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.05em;
        }

        /* 輕聲符號（正上方） */
        .zhuyin-tone-light {
            position: absolute;
            top: -0.45em;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75em;
            line-height: 1;
            font-weight: 900;
        }

        /* 二、三、四聲聲調符號（右側中間） */
        .zhuyin-tone-side {
            position: absolute;
            right: -0.58em;
            top: 45%;
            transform: translateY(-50%);
            font-size: 0.75em;
            line-height: 1;
            font-weight: 900;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 text-gray-800">

                    { char: '新', zhuyin: 'ㄒㄧㄣ' }
                ],
                targetIndex: 0, // 溫
                meaning: '複習舊有的知識，進而領悟出新的道理。',
                sentence: '讀書要常「溫故知新」，才能不斷進步。'
            }
        ];

        // 常用干擾注音庫 (用於組成 8 個純注音選項)
        const disturbanceZhuyinPool = [
            'ㄧㄢˊ', 'ㄕˊ', 'ㄅㄧˇ', 'ㄇㄟˇ', 'ㄧˋ', 'ㄏㄞˇ', 'ㄈㄥ', 
            'ㄕㄢ', 'ㄇㄧㄥˊ', 'ㄓ', 'ㄌㄧˇ', 'ㄏㄜˊ', 'ㄆㄧㄥˊ', 'ㄒㄧˇ', 
            'ㄌㄜˋ', 'ㄍㄨㄤ', 'ㄧㄥˇ', 'ㄒㄧㄣ', 'ㄞˋ', 'ㄉㄨㄢˇ', 'ㄔㄤˊ'
        ];

        // ==========================================
        // 2. 垂直（直書）注音解析與 HTML 渲染引擎
        // ==========================================
        function createVerticalZhuyinHTML(zhuyinStr, fontSizeClass = "text-sm sm:text-base") {
            if (!zhuyinStr) return '';

            let mainSymbols = '';
            let toneSymbol = '';
            let isLightTone = false;

            for (let char of zhuyinStr) {
                if (char === '˙') {
                    isLightTone = true;
                } else if (['ˊ', 'ˇ', 'ˋ'].includes(char)) {
                    toneSymbol = char;
                } else {
                    mainSymbols += char;
                }
            }

            let symbolsHTML = '';
            for (let symbol of mainSymbols) {
                symbolsHTML += `<span>${symbol}</span>`;
            }

            let lightToneHTML = isLightTone ? `<span class="zhuyin-tone-light">˙</span>` : '';
            let sideToneHTML = toneSymbol ? `<span class="zhuyin-tone-side">${toneSymbol}</span>` : '';

            return `
                <div class="zhuyin-vertical-container ${fontSizeClass}">
                    ${lightToneHTML}
                    <div class="zhuyin-symbols">
                        ${symbolsHTML}
                    </div>
                    ${sideToneHTML}
                </div>
            `;
        }

        // ==========================================
        // 3. 遊戲狀態與變數
        // ==========================================
        const TOTAL_QUESTIONS = 10;
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let soundEnabled = true;

        let draggedZhuyin = null; // 當前被拖曳的純注音字串
        let draggedElement = null;
        let touchClone = null;

        // 音效 Web Audio API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(174.61, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const subOsc = audioCtx.createOscillator();
                    const subGain = audioCtx.createGain();
                    subOsc.connect(subGain);
                    subGain.connect(audioCtx.destination);
                    subOsc.type = 'triangle';
                    subOsc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    subGain.gain.setValueAtTime(0.2, now + idx * 0.12);
                    subGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.3);
                    subOsc.start(now + idx * 0.12);
                    subOsc.stop(now + idx * 0.12 + 0.3);
                });
            }
        }

        // DOM 元素
        const scoreText = document.getElementById('score-text');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const targetCharDisplay = document.getElementById('target-char-display');
        const wordCardsContainer = document.getElementById('word-cards-container');
        const wordMeaning = document.getElementById('word-meaning');
        const contextSentence = document.getElementById('context-sentence');
        const optionsContainer = document.getElementById('options-container');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const soundIcon = document.getElementById('sound-icon');
        const resultModal = document.getElementById('result-modal');
        const restartBtn = document.getElementById('restart-btn');
        const finalCorrect = document.getElementById('final-correct');
        const finalScore = document.getElementById('final-score');
        const resultComment = document.getElementById('result-comment');

        // 打亂陣列工具
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ==========================================
        // 4. 遊戲流程控制器
        // ==========================================
        function initGame() {
            const shuffledBank = shuffle(vocabularyBank);
            currentQuestions = shuffledBank.slice(0, TOTAL_QUESTIONS);
            currentIndex = 0;
            score = 0;
            
            updateHeaderUI();
            loadQuestion(currentIndex);
            resultModal.classList.add('hidden');
        }

        function updateHeaderUI() {
            scoreText.textContent = score;
            progressText.textContent = `${currentIndex + 1} / ${TOTAL_QUESTIONS}`;
            const percentage = ((currentIndex) / TOTAL_QUESTIONS) * 100;
            progressBar.style.width = `${percentage}%`;
        }

        function loadQuestion(index) {
            const q = currentQuestions[index];
            const targetItem = q.word[q.targetIndex];

            targetCharDisplay.textContent = targetItem.char;
            wordMeaning.textContent = q.meaning;
            contextSentence.textContent = `「${q.sentence}」`;

            // 渲染題目詞彙卡片 (4個國字 + 目標字的注音放置格)
            renderWordCards(q);

            // 生成 8 個「純直式注音」選項 (包含 1 個正確注音 + 7 個干擾注音)
            const options = generate8ZhuyinOptions(targetItem.zhuyin);
            renderOptions(options);

            updateHeaderUI();
        }

        // 渲染題目區：完整呈現國字，目標字顯示亮色邊框與注音放置格
        function renderWordCards(q) {
            wordCardsContainer.innerHTML = '';

            q.word.forEach((item, idx) => {
                const isTarget = (idx === q.targetIndex);

                if (isTarget) {
                    // 目標字卡片 (突出高亮 + 下方 Drop Zone)
                    const card = document.createElement('div');
                    card.className = 'flex flex-col items-center gap-1 bg-amber-50 border-4 border-amber-400 rounded-2xl p-2 shadow-md relative';
                    
                    card.innerHTML = `
                        <!-- 國字 -->
                        <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white border-2 border-amber-300 rounded-xl mi-zi-ge flex items-center justify-center">
                            <span class="text-3xl sm:text-4xl font-black text-amber-900">${item.char}</span>
                        </div>
                        <!-- 直式注音拖曳放置區 (Drop Zone) -->
                        <div id="drop-zone" class="drop-zone w-16 h-20 sm:w-20 sm:h-24 border-2 border-dashed border-amber-500 bg-amber-100/70 rounded-xl flex flex-col items-center justify-center relative cursor-pointer shadow-inner">
                            <i id="drop-icon" class="fa-solid fa-arrow-down-long text-lg sm:text-xl text-amber-500 mb-0.5 animate-bounce"></i>
                            <span id="drop-prompt" class="text-[10px] sm:text-xs font-black text-amber-700">拉入注音</span>
                            <div id="dropped-content" class="hidden font-black text-amber-900"></div>
                        </div>
                    `;

                    wordCardsContainer.appendChild(card);

                    // 綁定 Drop Zone 事件
                    const dropZone = card.querySelector('#drop-zone');
                    dropZone.addEventListener('dragover', handleDragOver);
                    dropZone.addEventListener('dragleave', handleDragLeave);
                    dropZone.addEventListener('drop', handleDrop);

                } else {
                    // 非目標國字 (直接顯示國字與其對應直式注音)
                    const card = document.createElement('div');
                    card.className = 'flex flex-col items-center gap-1 bg-red-50/30 border-2 border-red-200 rounded-2xl p-2 shadow-sm';
                    
                    card.innerHTML = `
                        <!-- 國字 -->
                        <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white border-2 border-red-200 rounded-xl mi-zi-ge flex items-center justify-center">
                            <span class="text-3xl sm:text-4xl font-black text-gray-800">${item.char}</span>
                        </div>
                        <!-- 已填好的注音 -->
                        <div class="w-16 h-20 sm:w-20 sm:h-24 bg-white/80 border border-red-200 rounded-xl flex items-center justify-center text-red-600 font-bold">
                            ${createVerticalZhuyinHTML(item.zhuyin, "text-sm sm:text-base")}
                        </div>
                    `;
                    wordCardsContainer.appendChild(card);
                }
            });
        }

        // 生成 8 個純直式注音選項 (無國字)
        function generate8ZhuyinOptions(correctZhuyin) {
            const set = new Set();
            const optionsList = [correctZhuyin];
            set.add(correctZhuyin);

            const shuffledPool = shuffle(disturbanceZhuyinPool);
            for (let z of shuffledPool) {
                if (optionsList.length >= 8) break;
                if (!set.has(z)) {
                    set.add(z);
                    optionsList.push(z);
                }
            }

            return shuffle(optionsList);
        }

        // 渲染 8 個純注音選項卡片
        function renderOptions(options) {
            optionsContainer.innerHTML = '';
            options.forEach((zhuyinStr, idx) => {
                const card = document.createElement('div');
                card.className = 'draggable-card w-full max-w-[70px] sm:max-w-[80px] h-24 sm:h-28 bg-white hover:bg-emerald-50 border-2 border-emerald-400 rounded-2xl p-1 text-center font-black shadow-sm flex items-center justify-center select-none cursor-grab active:scale-95';
                
                // 純直式注音內容
                card.innerHTML = createVerticalZhuyinHTML(zhuyinStr, "text-base sm:text-lg font-black text-emerald-800");

                card.setAttribute('draggable', 'true');
                card.dataset.zhuyin = zhuyinStr;
                card.dataset.id = idx;

                // 滑鼠事件
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);

                // 觸控事件 (Mobile Touch)
                card.addEventListener('touchstart', handleTouchStart, { passive: false });
                card.addEventListener('touchmove', handleTouchMove, { passive: false });
                card.addEventListener('touchend', handleTouchEnd, { passive: false });

                optionsContainer.appendChild(card);
            });
        }

        // ==========================================
        // 5. 拖曳事件處理 (Mouse & Touch)
        // ==========================================
        function handleDragStart(e) {
            draggedZhuyin = this.dataset.zhuyin;
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.setData('text/plain', draggedZhuyin);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedZhuyin = null;
            draggedElement = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            let droppedZhuyin = e.dataTransfer.getData('text/plain') || draggedZhuyin;

            if (droppedZhuyin) {
                checkAnswer(droppedZhuyin, draggedElement);
            }
        }

        // Touch 控制
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            draggedElement = this;
            draggedZhuyin = this.dataset.zhuyin;

            touchClone = this.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.width = `${this.offsetWidth}px`;
            touchClone.style.height = `${this.offsetHeight}px`;
            touchClone.style.left = `${touch.clientX - this.offsetWidth / 2}px`;
            touchClone.style.top = `${touch.clientY - this.offsetHeight / 2}px`;
            touchClone.style.zIndex = '1000';
            touchClone.style.pointerEvents = 'none';
            touchClone.style.opacity = '0.9';
            touchClone.style.transform = 'scale(1.1)';
            touchClone.classList.add('shadow-2xl', 'border-emerald-500', 'bg-white');

            document.body.appendChild(touchClone);
            this.classList.add('opacity-40');
        }

        function handleTouchMove(e) {
            if (!touchClone) return;
            e.preventDefault();
            const touch = e.touches[0];

            touchClone.style.left = `${touch.clientX - touchClone.offsetWidth / 2}px`;
            touchClone.style.top = `${touch.clientY - touchClone.offsetHeight / 2}px`;

            const dropZone = document.getElementById('drop-zone');
            if (!dropZone) return;

            const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            if (elemBelow && (elemBelow === dropZone || dropZone.contains(elemBelow))) {
                dropZone.classList.add('drag-over');
            } else {
                dropZone.classList.remove('drag-over');
            }
        }

        function handleTouchEnd(e) {
            if (!touchClone) return;
            e.preventDefault();

            const touch = e.changedTouches[0];
            const dropZone = document.getElementById('drop-zone');

            if (draggedElement) {
                draggedElement.classList.remove('opacity-40');
            }

            if (dropZone) dropZone.classList.remove('drag-over');

            if (touchClone && touchClone.parentNode) {
                touchClone.parentNode.removeChild(touchClone);
            }
            touchClone = null;

            if (dropZone) {
                const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elemBelow && (elemBelow === dropZone || dropZone.contains(elemBelow))) {
                    if (draggedZhuyin) {
                        checkAnswer(draggedZhuyin, draggedElement);
                    }
                }
            }

            draggedElement = null;
            draggedZhuyin = null;
        }

        // ==========================================
        // 6. 答題判定與效果
        // ==========================================
        function checkAnswer(selectedZhuyin, targetElement) {
            const currentQ = currentQuestions[currentIndex];
            const targetZhuyin = currentQ.word[currentQ.targetIndex].zhuyin;
            const isCorrect = (selectedZhuyin === targetZhuyin);

            const dropZone = document.getElementById('drop-zone');
            const dropIcon = document.getElementById('drop-icon');
            const dropPrompt = document.getElementById('drop-prompt');
            const droppedContent = document.getElementById('dropped-content');

            if (isCorrect) {
                playSound('correct');
                score += 10;
                scoreText.textContent = score;

                // 填空格內顯示正確直式注音
                if (dropIcon) dropIcon.classList.add('hidden');
                if (dropPrompt) dropPrompt.classList.add('hidden');
                
                droppedContent.classList.remove('hidden');
                droppedContent.innerHTML = createVerticalZhuyinHTML(selectedZhuyin, "text-base sm:text-lg font-black text-emerald-900");

                dropZone.className = "drop-zone w-16 h-20 sm:w-20 sm:h-24 border-2 border-emerald-500 bg-emerald-100 rounded-xl flex items-center justify-center relative animate-correct shadow-md";

                // 紙花特效
                confetti({
                    particleCount: 45,
                    spread: 60,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < TOTAL_QUESTIONS) {
                        loadQuestion(currentIndex);
                    } else {
                        endGame();
                    }
                }, 1200);

            } else {
                playSound('wrong');

                if (dropZone) {
                    dropZone.className = "drop-zone w-16 h-20 sm:w-20 sm:h-24 border-2 border-red-500 bg-red-50 rounded-xl flex flex-col items-center justify-center relative animate-wrong";
                }

                if (targetElement) {
                    targetElement.classList.add('border-red-500', 'bg-red-50', 'animate-wrong');
                    setTimeout(() => {
                        targetElement.classList.remove('border-red-500', 'bg-red-50', 'animate-wrong');
                    }, 600);
                }

                setTimeout(() => {
                    if (dropZone) {
                        dropZone.className = "drop-zone w-16 h-20 sm:w-20 sm:h-24 border-2 border-dashed border-amber-500 bg-amber-100/70 rounded-xl flex flex-col items-center justify-center relative shadow-inner";
                    }
                }, 800);
            }
        }

        // ==========================================
        // 7. 結算與控制事件
        // ==========================================
        function endGame() {
            progressBar.style.width = '100%';
            playSound('win');

            confetti({
                particleCount: 130,
                spread: 100,
                origin: { y: 0.4 }
            });

            finalCorrect.textContent = `${score / 10} / ${TOTAL_QUESTIONS}`;
            finalScore.textContent = `${score} 分`;

            if (score === 100) {
                resultComment.textContent = '太厲害了！你是完美的拼音詞彙大師！🏆';
            } else if (score >= 80) {
                resultComment.textContent = '表現非常棒！大部分注音拼音都難不倒你！🌟';
            } else if (score >= 60) {
                resultComment.textContent = '順利通過測試！再多練習注音會更熟練喔！👍';
            } else {
                resultComment.textContent = '加油！多複習注音符號與聲調，下次一定拿高分！💪';
            }

            resultModal.classList.remove('hidden');
        }

        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fa-solid fa-volume-high text-lg text-emerald-600";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-lg text-gray-400";
            }
        });

        restartBtn.addEventListener('click', () => {
            initGame();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initGame();
        });
    </script>
</body>
</html>
